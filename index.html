<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Компас" />
<meta name="theme-color" content="#10131C" />
<title>Компас — привычки, задачи, долги</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2310131C'/%3E%3Ccircle cx='50' cy='50' r='28' fill='none' stroke='%237C8CFF' stroke-width='9'/%3E%3Cpath d='M36 50 46 60 66 38' fill='none' stroke='%237C8CFF' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2310131C'/%3E%3Ccircle cx='50' cy='50' r='28' fill='none' stroke='%237C8CFF' stroke-width='9'/%3E%3Cpath d='M36 50 46 60 66 38' fill='none' stroke='%237C8CFF' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{margin:0;padding:0}
:root{color-scheme:dark}
.app[data-theme="dark"]{
  --bg:#10131C;--card:#1A1F2E;--card-raised:#222840;--ink:#EEF0F8;--ink-soft:#8B90A8;
  --line:#2A2F45;--accent:#7C8CFF;--accent-ink:#0E1020;--good:#7FD9A8;--bad:#FF8FA3;--warn:#FFC875;
  --blue:#7FA8FF;--pink:#FF8FB1;--purple:#B18CFF;--orange:#FFB273;--green:#8FE0A8;
}
.app[data-theme="light"]{
  --bg:#F2F4FB;--card:#FFFFFF;--card-raised:#F1F3FC;--ink:#20233A;--ink-soft:#767CA0;
  --line:#E4E7F5;--accent:#5B6EF5;--accent-ink:#FFFFFF;--good:#2FAE72;--bad:#E14D68;--warn:#E0912A;
  --blue:#5B84E8;--pink:#E85B90;--purple:#8A5BE8;--orange:#E88A3D;--green:#2FAE72;
}
body{background:var(--bg)}
.app{font-family:-apple-system,"Inter","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;font-variant-numeric:tabular-nums;transition:background .15s ease,color .15s ease}
.shell{display:flex;max-width:1080px;margin:0 auto}
.side{display:none}
.main{flex:1;min-width:0;padding:18px 16px 90px;padding-top:calc(18px + env(safe-area-inset-top));
  padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{display:flex;flex-direction:column}
.brand .k{font-size:11px;letter-spacing:.06em;color:var(--ink-soft);text-transform:uppercase}
.brand h1{font-size:19px;font-weight:800;margin:2px 0 0}
.theme-btn{background:var(--card);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;max-width:1080px;margin:0 auto}
.nav-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  gap:2px;padding:6px 2px;color:var(--ink-soft);font-size:10px;font-weight:600;border-radius:10px}
.nav-btn .ic{font-size:18px}
.nav-btn.is-active{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;
  animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.card-label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;font-weight:700}
.empty{color:var(--ink-soft);padding:16px 6px;font-size:13px;text-align:center}
.btn{font-family:inherit;font-size:12.5px;font-weight:700;border:none;border-radius:10px;padding:9px 14px;cursor:pointer}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:none;color:var(--ink-soft)}
.btn-ghost:hover{color:var(--ink)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
input,select{font-family:inherit;font-size:13.5px;background:var(--card-raised);border:1px solid var(--line);
  border-radius:9px;padding:9px 10px;color:var(--ink);outline:none;width:100%}
textarea{font-family:inherit;font-size:13.5px;background:var(--card-raised);border:1px solid var(--line);
  border-radius:9px;padding:9px 10px;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.form-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.form-grid > *{flex:1;min-width:110px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:20px;font-size:12.5px;font-weight:700;z-index:50;animation:toastin .2s ease;
  box-shadow:0 6px 18px rgba(0,0,0,.25)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* dashboard */
.hero{background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:20px;padding:18px;color:#fff;
  margin-bottom:14px}
.hero .greet{font-size:17px;font-weight:800;margin-bottom:2px}
.hero .date{font-size:12.5px;opacity:.9}
.hero .motiv{font-size:12px;opacity:.85;margin-top:8px}
.hero .quote{font-size:12.5px;font-style:italic;opacity:.95;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.25)}
.ring-wrap{display:flex;align-items:center;gap:16px;margin-top:12px}
.ring-svg{width:64px;height:64px;transform:rotate(-90deg);flex:none}
.ring-track{fill:none;stroke:rgba(255,255,255,.28);stroke-width:9}
.ring-fill{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round}
.ring-pct{font-size:20px;font-weight:800}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat-box .n{font-size:18px;font-weight:800;display:block}
.stat-box .l{font-size:10.5px;color:var(--ink-soft)}
.stat-box.blue{border-color:transparent;background:color-mix(in srgb, var(--blue) 14%, var(--card))}
.stat-box.pink{background:color-mix(in srgb, var(--pink) 14%, var(--card))}
.stat-box.purple{background:color-mix(in srgb, var(--purple) 14%, var(--card))}
.stat-box.orange{background:color-mix(in srgb, var(--orange) 14%, var(--card))}
.banner-warn{background:color-mix(in srgb, var(--warn) 20%, var(--card));border:1px solid var(--warn);
  border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;color:var(--ink)}
.smart-msg{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px}
.check-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.check-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--card-raised)}
.checkbox{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--line);background:var(--card);
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .1s ease}
.checkbox:active{transform:scale(.88)}
.checkbox.is-checked{background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.ci-title{flex:1;font-size:13.5px}
.ci-title.done{color:var(--ink-soft);text-decoration:line-through}
.ci-sub{font-size:11px;color:var(--ink-soft)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.prio{width:7px;height:7px;border-radius:50%;flex:none}
.prio.high{background:var(--bad)}.prio.medium{background:var(--warn)}.prio.low{background:var(--good)}
.chart-svg{width:100%;height:70px;display:block}
.chart-area{fill:color-mix(in srgb, var(--accent) 16%, transparent)}
.chart-line{fill:none;stroke:var(--accent);stroke-width:2}
.bars{display:flex;align-items:flex-end;gap:6px;height:70px}
.bar{flex:1;border-radius:5px 5px 0 0;background:var(--accent);min-height:2px}
.bar-lbl{display:flex;gap:6px;margin-top:4px}
.bar-lbl span{flex:1;text-align:center;font-size:9px;color:var(--ink-soft)}

/* habits grid (kept) */
.month-nav{display:flex;align-items:center;gap:10px}
.nav-arrow{font-size:15px;background:var(--card-raised);border:1px solid var(--line);border-radius:8px;
  width:28px;height:28px;cursor:pointer;color:var(--ink)}
.nav-arrow:disabled{opacity:.3}
.month-label{font-size:13px;font-weight:700;text-transform:capitalize;min-width:100px;text-align:center}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.sticky{position:sticky;left:0;background:var(--card);z-index:2}
.corner{min-width:130px}
.weekband{font-size:10px;font-weight:800;color:#10131C;padding:5px 0;text-align:center;border-radius:8px 8px 0 0}
.app[data-theme="light"] .weekband{color:#20233A}
.daycell{width:26px;min-width:26px;text-align:center;padding:4px 0;border-bottom:1px solid var(--line)}
.daycell .dn{display:block;font-size:11px;font-weight:700}
.daycell .wd{display:block;font-size:8px;color:var(--ink-soft)}
.daycell.today{color:var(--accent)}.daycell.today .dn{color:var(--accent)}
.proghead{min-width:100px;font-size:10px;color:var(--ink-soft);text-align:center;text-transform:uppercase}
.namecell{display:flex;align-items:center;gap:6px;padding:7px 6px 7px 2px;border-bottom:1px solid var(--line);
  font-size:12.5px;white-space:nowrap}
.nametext{overflow:hidden;text-overflow:ellipsis;max-width:130px}
.target-tag{color:var(--ink-soft);font-size:10.5px}
.rm{margin-left:auto;font-size:14px;color:var(--ink-soft);cursor:pointer;padding:0 2px}
.checkcell{text-align:center;border-bottom:1px solid var(--line);padding:3px 0}
.box{width:20px;height:20px;border-radius:5px;border:1.4px solid var(--line);background:var(--card-raised);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.box.is-checked{background:var(--c);border-color:var(--c)}
.box.is-future{opacity:.3}
.progcell{padding:7px 6px;border-bottom:1px solid var(--line);min-width:100px}
.bartrack{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:3px}
.barfill{height:100%;border-radius:3px;transition:width .2s ease}
.barlbl{font-size:10px;color:var(--ink-soft)}
.ranklist{list-style:none;margin:0;padding:0;counter-reset:rank}
.ranklist li{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line)}
.ranklist li:last-child{border-bottom:none}
.ranklist li::before{counter-increment:rank;content:counter(rank);font-size:11px;color:var(--ink-soft);width:14px}

/* weekly tasks */
.tasks-week-wrap{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.tw-col{flex:0 0 150px;display:flex;flex-direction:column;gap:8px}
.tw-head{font-size:11px;font-weight:800;padding-bottom:6px;border-bottom:2px solid}
.tw-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tw-item{display:flex;align-items:center;gap:6px}
.tw-check{width:16px;height:16px;border-radius:4px;border:1.4px solid var(--line);background:var(--card-raised);
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.tw-check.is-checked{background:var(--accent);border-color:var(--accent)}
.tw-text{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw-text.done{color:var(--ink-soft);text-decoration:line-through}
.tw-rm{font-size:12px;color:var(--ink-soft);cursor:pointer}

/* tasks tab */
.filter-row{display:flex;gap:6px;background:var(--card-raised);border-radius:11px;padding:4px;margin-bottom:12px}
.filter-btn{flex:1;text-align:center;padding:7px 0;border-radius:8px;font-size:12px;font-weight:700;
  color:var(--ink-soft);background:none;border:none;cursor:pointer}
.filter-btn.is-active{background:var(--accent);color:var(--accent-ink)}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:12px;background:var(--card-raised);
  margin-bottom:8px}
.task-main{flex:1;min-width:0}
.task-title{font-size:13.5px;font-weight:600}
.task-title.done{color:var(--ink-soft);text-decoration:line-through}
.task-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--card)}
.task-actions{display:flex;gap:8px;flex:none}
.icon-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:13px;padding:2px}

/* goals */
.goal-card{background:var(--card-raised);border-radius:14px;padding:12px;margin-bottom:10px}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.goal-name{font-size:13.5px;font-weight:700}
.goal-nums{font-size:12px;color:var(--ink-soft)}
.goal-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.stepper{display:flex;gap:6px}
.step-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--card);
  cursor:pointer;font-size:14px;color:var(--ink)}

/* debts */
.debt-card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--card-raised)}
.debt-card.overdue{border-color:var(--bad)}
.debt-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px}
.debt-name{font-size:13.5px;font-weight:700}
.debt-nums{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.debt-nums b{color:var(--ink)}
.debt-due{font-size:11px;color:var(--ink-soft);margin-top:4px}
.debt-due.overdue{color:var(--bad);font-weight:700}
.debt-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.subtab-row{display:flex;gap:8px;margin-bottom:10px}
.subtab{font-size:12px;font-weight:700;color:var(--ink-soft);background:var(--card-raised);border:none;
  border-radius:8px;padding:6px 10px;cursor:pointer}
.subtab.is-active{background:var(--accent);color:var(--accent-ink)}
.tx-list{list-style:none;margin:0;padding:0}
.tx-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.tx-item:last-child{border-bottom:none}
.tx-badge{font-size:10px;padding:3px 6px;border-radius:5px;font-weight:700;flex:none}
.tx-badge.income{background:color-mix(in srgb, var(--good) 20%, transparent);color:var(--good)}
.tx-badge.expense{background:color-mix(in srgb, var(--bad) 20%, transparent);color:var(--bad)}
.tx-badge.payment{background:color-mix(in srgb, var(--accent) 20%, transparent);color:var(--accent)}
.tx-note{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-soft)}
.tx-amount{font-weight:700;white-space:nowrap}
.tx-amount.income{color:var(--good)}.tx-amount.expense{color:var(--bad)}

/* stats */
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-tile{background:var(--card-raised);border-radius:14px;padding:12px}
.stat-tile .n{font-size:17px;font-weight:800;display:block}
.stat-tile .l{font-size:10.5px;color:var(--ink-soft)}

@media (min-width:780px){
  .side{display:flex;flex-direction:column;width:220px;flex:none;padding:22px 14px;border-right:1px solid var(--line);
    gap:4px;position:sticky;top:0;align-self:flex-start;height:100vh}
  .side .brand{margin-bottom:18px;padding:0 6px}
  .side .nav-btn{flex-direction:row;justify-content:flex-start;gap:10px;font-size:13px;padding:10px 10px}
  .side .nav-btn .ic{font-size:16px}
  .bottomnav{display:none}
  .main{padding:22px 24px;padding-bottom:22px}
  .stat-grid,.stat-row{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
var pad=function(n){return String(n).padStart(2,"0")};
var toKey=function(y,m,d){return y+"-"+pad(m)+"-"+pad(d)};
var todayObj=function(){var dt=new Date();return{y:dt.getFullYear(),m:dt.getMonth()+1,d:dt.getDate()}};
var todayKey=function(){var t=todayObj();return toKey(t.y,t.m,t.d)};
var daysInMonth=function(y,m){return new Date(y,m,0).getDate()};
var weekdayShort=function(y,m,d){return new Date(y,m-1,d).toLocaleDateString("ru-RU",{weekday:"short"}).replace(".","")};
var MONTHS=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
var WEEKDAYS_FULL=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
var fmtHeaderDate=function(){return new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"})};
var back1=function(k){var p=k.split("-").map(Number),dt=new Date(p[0],p[1]-1,p[2]);dt.setDate(dt.getDate()-1);return toKey(dt.getFullYear(),dt.getMonth()+1,dt.getDate())};
var next1=function(k){var p=k.split("-").map(Number),dt=new Date(p[0],p[1]-1,p[2]);dt.setDate(dt.getDate()+1);return toKey(dt.getFullYear(),dt.getMonth()+1,dt.getDate())};
var fmtNum=function(n){return Number(n||0).toLocaleString("ru-RU")};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var uid=function(p){return p+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7)};

var WEEK_COLORS=["#7FA8FF","#FFB273","#FF8FB1","#B18CFF","#8FE0A8"];
var HABIT_PALETTE=["#7C8CFF","#E0A455","#B183E8","#E07890","#5CA3E0","#8FE0A8"];
var DEFAULT_HABITS=[
  {name:"Зал",weeklyTarget:3},
  {name:"Торговля: 3 сделки",weeklyTarget:null},
  {name:"Книга: 10 страниц",weeklyTarget:null},
  {name:"Учёба",weeklyTarget:null},
  {name:"Работа",weeklyTarget:null}
];
var TASK_CATS=["Работа","Учёба","Финансы","Спорт","Личное","Строительство","Трейдинг","Другое"];
var GYM_SLUG=function(name){return name.toLowerCase().replace(/[^a-zа-я0-9]+/gi,"-")};
function mkEx(name,sets,lo,hi){return{id:GYM_SLUG(name),name:name,sets:sets,repLow:lo,repHigh:hi,restSec:(lo<=6?150:75)}}
var DEFAULT_GYM_PROGRAMS={
  A:[mkEx("Присед со штангой",3,6,10),mkEx("Жим на грудь в тренажёре",3,8,12),mkEx("Тяга верхнего блока",3,8,12),
     mkEx("Разведения на заднюю/среднюю дельту",3,10,15),mkEx("Сгибание ног",3,10,12),mkEx("Подъём гантелей на бицепс",3,10,12),
     mkEx("Разгибание рук на блоке",3,10,12),mkEx("Пресс",3,12,20)],
  B:[mkEx("Присед со штангой",3,6,10),mkEx("Жим вверх в тренажёре",3,8,12),mkEx("Горизонтальная тяга",3,8,12),
     mkEx("Жим на грудь",3,8,12),mkEx("Сгибание ног",3,10,12),mkEx("Подъём гантелей на бицепс",3,10,12),mkEx("Пресс",3,12,20)],
  C:[mkEx("Присед со штангой",3,6,10),mkEx("Жим на грудь",3,8,12),mkEx("Тяга верхнего блока",3,8,12),
     mkEx("Горизонтальная тяга",3,8,12),mkEx("Сгибание ног",3,10,12),mkEx("Разведения на плечи",3,10,15),
     mkEx("Бицепс",3,10,12),mkEx("Трицепс",3,10,12)]
};
var GYM_ORDER=["A","B","C"];
var BENCH_TARGET=100;
var BENCH_MILESTONES=[75,80,85,90,95,100];

function getDailyQuote(){
  var t0=todayObj();
  var start=new Date(t0.y,0,0);
  var diff=new Date(t0.y,t0.m-1,t0.d)-start;
  var dayOfYear=Math.floor(diff/86400000);
  return QUOTES[dayOfYear%QUOTES.length];
}

function currentStreak(dateSet,today){
  var streak=0,cursor=today;
  if(!dateSet.has(cursor))cursor=back1(cursor);
  while(dateSet.has(cursor)){streak+=1;cursor=back1(cursor)}
  return streak;
}
function longestStreak(dateSet){
  if(dateSet.size===0)return 0;
  var sorted=Array.from(dateSet).sort();
  var best=1,run=1;
  for(var i=1;i<sorted.length;i++){if(next1(sorted[i-1])===sorted[i])run+=1;else run=1;best=Math.max(best,run)}
  return best;
}
function perHabitTarget(h,denominatorDays){
  if(h.weeklyTarget)return Math.max(1,Math.round((h.weeklyTarget*denominatorDays)/7));
  return denominatorDays;
}

var STORAGE_KEY="habit-tracker-local-v3";
var OLD_KEY="habit-tracker-local-v2";

function loadState(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      var p=JSON.parse(raw);
      return{
        habits:p.habits||[],entries:p.entries||{},weekTasks:p.weekTasks||{},
        debts:(p.debts||[]).map(function(d){return Object.assign({type:"i_owe",dueDate:null,note:""},d)}),
        transactions:p.transactions||[],tasks:p.tasks||[],goals:p.goals||[],theme:p.theme||"dark",
        soundOn:p.soundOn!==false,
        gymPrograms:p.gymPrograms||JSON.parse(JSON.stringify(DEFAULT_GYM_PROGRAMS)),
        gymSessions:p.gymSessions||[],activeWorkout:p.activeWorkout||null,
        benchLogs:p.benchLogs||[],bodyWeight:p.bodyWeight||{current:null,target:null},
        journal:p.journal||{},xp:p.xp||0,unlockedAchievements:p.unlockedAchievements||{}
      };
    }
    var old=localStorage.getItem(OLD_KEY);
    if(old){
      var op=JSON.parse(old);
      return{
        habits:op.habits||[],entries:op.entries||{},weekTasks:op.weekTasks||{},
        debts:(op.debts||[]).map(function(d){return Object.assign({type:"i_owe",dueDate:null,note:""},d)}),
        transactions:op.transactions||[],tasks:[],goals:[],theme:op.theme||"dark",
        soundOn:true,gymPrograms:JSON.parse(JSON.stringify(DEFAULT_GYM_PROGRAMS)),gymSessions:[],activeWorkout:null,
        benchLogs:[],bodyWeight:{current:null,target:null},journal:{},xp:0,unlockedAchievements:{}
      };
    }
  }catch(e){}
  var seeded=DEFAULT_HABITS.map(function(h,i){
    return{id:uid("h"),name:h.name,weeklyTarget:h.weeklyTarget,color:HABIT_PALETTE[i%HABIT_PALETTE.length],createdAt:todayKey()};
  });
  return{habits:seeded,entries:{},weekTasks:{},debts:[],transactions:[],tasks:[],goals:[],theme:"dark",soundOn:true,
    gymPrograms:JSON.parse(JSON.stringify(DEFAULT_GYM_PROGRAMS)),gymSessions:[],activeWorkout:null,
    benchLogs:[],bodyWeight:{current:null,target:null},journal:{},xp:0,unlockedAchievements:{}};
}

function computeHabitStats(year,month){
  var today=todayKey();var t0=todayObj();
  var isCur=year===t0.y&&month===t0.m;
  var monthLen=daysInMonth(year,month);
  var dayList=[];for(var i=1;i<=monthLen;i++)dayList.push(i);
  var denom=isCur?t0.d:monthLen;
  return state.habits.map(function(h){
    var allDates=new Set(Object.keys(state.entries[h.id]||{}));
    var monthCount=dayList.filter(function(d){return allDates.has(toKey(year,month,d))}).length;
    return Object.assign({},h,{allDates:allDates,current:currentStreak(allDates,today),longest:longestStreak(allDates),
      monthCount:monthCount,target:perHabitTarget(h,denom)});
  });
}

  var today=todayKey();
  return state.debts.map(function(d){
    var paid=state.transactions.filter(function(t){return t.type==="payment"&&t.debtId===d.id}).reduce(function(s,t){return s+t.amount},0);
    var remaining=Math.max(0,d.totalAmount-paid);
    var overdue=!!(d.dueDate&&d.dueDate<today&&remaining>0);
    return Object.assign({},d,{paid:paid,remaining:remaining,overdue:overdue});
  });
}

/* ---------- gym ---------- */
function exerciseHistory(name){
  var list=[];
  state.gymSessions.forEach(function(s){
    s.exercises.forEach(function(ex){
      if(ex.name===name){
        var doneSets=ex.sets.filter(function(st){return st.done});
        if(doneSets.length)list.push({date:s.date,sets:doneSets});
      }
    });
  });
  return list.sort(function(a,b){return b.date.localeCompare(a.date)});
}
function bestWeightFor(name){
  var best=0;
  exerciseHistory(name).forEach(function(h){h.sets.forEach(function(st){if(st.weight>best)best=st.weight})});
  return best;
}
function suggestNextWeight(name,repHigh){
  var hist=exerciseHistory(name);
  if(!hist.length)return null;
  var last=hist[0];
  var allTop=last.sets.every(function(st){return st.reps>=repHigh});
  var lastWeight=last.sets[last.sets.length-1].weight;
  if(allTop)return Math.round((lastWeight+2.5)*2)/2;
  return lastWeight;
}
function nextProgramKey(){
  var last=state.gymSessions[0];
  if(!last)return "A";
  var idx=GYM_ORDER.indexOf(last.programKey);
  return GYM_ORDER[(idx+1)%GYM_ORDER.length];
}
function gymStreak(){
  if(!state.gymSessions.length)return 0;
  var days=Array.from(new Set(state.gymSessions.map(function(s){return s.date}))).sort().reverse();
  var streak=0,cursor=todayKey();
  if(days[0]!==cursor)cursor=back1(cursor);
  for(var i=0;i<days.length;i++){
    if(days[i]===cursor){streak+=1;cursor=back1(cursor);}
    else if(days[i]<cursor)break;
  }
  return streak;
}
function startWorkout(programKey){
  var prog=state.gymPrograms[programKey];
  state.activeWorkout={
    programKey:programKey,startedAt:Date.now(),exIndex:0,
    exercises:prog.map(function(e){return{id:e.id,name:e.name,repLow:e.repLow,repHigh:e.repHigh,restSec:e.restSec,sets:[]}})
  };
  ui.gymNextWeightDraft={};
  save();render();
}
function resumeOrStart(programKey){
  if(state.activeWorkout){render();return;}
  startWorkout(programKey);
}
function abandonWorkout(){
  if(!confirm("Прервать текущую тренировку? Несохранённые подходы будут потеряны."))return;
  state.activeWorkout=null;save();render();
}
function gymSetWeightDraft(exIdx,v){ui.gymNextWeightDraft[exIdx]=v}
function gymBumpDraft(exIdx,delta){
  var cur=parseFloat(ui.gymNextWeightDraft[exIdx]);
  if(isNaN(cur)){
    var ex=state.activeWorkout.exercises[exIdx];
    cur=suggestNextWeight(ex.name,ex.repHigh)||20;
  }
  ui.gymNextWeightDraft[exIdx]=Math.max(0,Math.round((cur+delta)*2)/2);
  render();
}
function logSet(exIdx,repsInputSel){
  var w=state.activeWorkout;if(!w)return;
  var ex=w.exercises[exIdx];
  var weight=parseFloat(ui.gymNextWeightDraft[exIdx]);
  if(isNaN(weight))weight=suggestNextWeight(ex.name,ex.repHigh)||0;
  var repsEl=document.querySelector(repsInputSel);
  var reps=repsEl?parseInt(repsEl.value,10):ex.repHigh;
  if(isNaN(reps)||reps<0)reps=0;
  ex.sets.push({weight:weight,reps:reps,done:true});
  save();
  ui.restEndAt=Date.now()+ex.restSec*1000;
  ui.restExName=ex.name;
  render();
}
function removeSet(exIdx,setIdx){
  state.activeWorkout.exercises[exIdx].sets.splice(setIdx,1);save();render();
}
function gymGoExercise(exIdx){state.activeWorkout.exIndex=Math.max(0,Math.min(state.activeWorkout.exercises.length-1,exIdx));render()}
function adjustRest(delta){
  if(!ui.restEndAt)return;
  ui.restEndAt+=delta*1000;render();
}
function skipRest(){ui.restEndAt=null;render()}
function finishWorkout(){
  var w=state.activeWorkout;if(!w)return;
  var totalSets=0,volume=0,prCount=0;
  w.exercises.forEach(function(ex){
    var prevBest=bestWeightFor(ex.name);
    ex.sets.forEach(function(st){if(st.done){totalSets+=1;volume+=st.weight*st.reps;if(st.weight>prevBest)prCount+=1;}});
  });
  var durationMin=Math.max(1,Math.round((Date.now()-w.startedAt)/60000));
  var session={id:uid("gs"),date:todayKey(),programKey:w.programKey,durationMin:durationMin,
    exercises:w.exercises.map(function(ex){return{name:ex.name,sets:ex.sets}}),volume:Math.round(volume),prCount:prCount};
  state.gymSessions=[session].concat(state.gymSessions);
  state.activeWorkout=null;ui.restEndAt=null;
  gainXP(30+10*prCount);
  save();checkAchievements();
  ui.gymLastSummary=session;
  showToast(prCount>0?"Тренировка завершена, новый PR 🔥":"Тренировка завершена 🔥");
}

}

function checkAchievements(){
  var newly=[];
  ACHIEVEMENTS.forEach(function(a){
    if(!state.unlockedAchievements[a.id]&&a.test()){
      state.unlockedAchievements=Object.assign({},state.unlockedAchievements);
      state.unlockedAchievements[a.id]=Date.now();
      newly.push(a);
    }
  });
  if(newly.length){
    gainXP(20*newly.length);
    newly.forEach(function(a,i){setTimeout(function(){showToast(a.icon+" Достижение: "+a.title)},400*(i+1));});

function computeDaySummary(dateKey){
  var habitStats=computeHabitStats(todayObj().y,todayObj().m);
  var doneHabits=habitStats.filter(function(h){return h.allDates.has(dateKey)});
  var dayTasks=state.tasks.filter(function(t){return t.date===dateKey});
  var doneTasks=dayTasks.filter(function(t){return t.done});
  var totalHabits=habitStats.length,totalTasks=dayTasks.length;
  var parts=[];if(totalHabits)parts.push(doneHabits.length/totalHabits);if(totalTasks)parts.push(doneTasks.length/totalTasks);
  var pct=parts.length?Math.round((parts.reduce(function(a,b){return a+b},0)/parts.length)*100):0;
  var streak=habitStats.reduce(function(m,h){return Math.max(m,h.current)},0);
  var monthPfx=dateKey.slice(0,7);
  var income=state.transactions.filter(function(t){return t.type==="income"&&t.date===dateKey}).reduce(function(s,t){return s+t.amount},0);
  var expense=state.transactions.filter(function(t){return (t.type==="expense"||t.type==="payment")&&t.date===dateKey}).reduce(function(s,t){return s+t.amount},0);
  var net=income-expense;
  var highDoneTask=doneTasks.find(function(t){return t.priority==="high"});
  var mainAchievement=highDoneTask?highDoneTask.title:(doneHabits.length?doneHabits.sort(function(a,b){return b.current-a.current})[0].name+" выполнена":null);
  var tomorrow=next1(dateKey);
  var tmrwTasks=state.tasks.filter(function(t){return t.date===tomorrow&&!t.done}).sort(function(a,b){
    var pr={high:0,medium:1,low:2};return (pr[a.priority]||1)-(pr[b.priority]||1);
  });
  return{
    doneHabits:doneHabits.length,totalHabits:totalHabits,doneTasks:doneTasks.length,totalTasks:totalTasks,
    pct:pct,streak:streak,net:net,mainAchievement:mainAchievement,tomorrowTask:tmrwTasks[0]||null
  };
}

/* ---------- click sound ---------- */
var audioCtx=null;
function playClick(){
  if(state.soundOn===false)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
    var t=audioCtx.currentTime;
    var osc=audioCtx.createOscillator();
    var gain=audioCtx.createGain();
    osc.type="sine";
    osc.frequency.setValueAtTime(720,t);
    osc.frequency.exponentialRampToValueAtTime(420,t+0.06);
    gain.gain.setValueAtTime(0.09,t);
    gain.gain.exponentialRampToValueAtTime(0.0001,t+0.08);
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start(t);osc.stop(t+0.09);
  }catch(e){}
}

/* ---------- render: stats tab ---------- */
function renderStatsTab(){
  var t0=todayObj();
  var habitStatsMonth=computeHabitStats(state.viewYear,state.viewMonth);
  var monthLen=daysInMonth(state.viewYear,state.viewMonth);
  var isCur=state.viewYear===t0.y&&state.viewMonth===t0.m;
  var denom=isCur?t0.d:monthLen;
  var totalPossible=habitStatsMonth.reduce(function(s,h){return s+h.target},0);
  var totalDone=habitStatsMonth.reduce(function(s,h){return s+h.monthCount},0);
  var monthPct=totalPossible?Math.round((totalDone/totalPossible)*100):0;
  var best=habitStatsMonth.slice().sort(function(a,b){return b.monthCount-a.monthCount})[0];
  var worst=habitStatsMonth.slice().sort(function(a,b){return a.monthCount-b.monthCount})[0];
  var longestOverall=habitStatsMonth.reduce(function(m,h){return Math.max(m,h.longest)},0);

  var tasksAll=state.tasks;
  var tasksDone=tasksAll.filter(function(t){return t.done}).length;
  var today=todayKey();
  var tasksMissed=tasksAll.filter(function(t){return !t.done&&t.date&&t.date<today}).length;
  var taskPct=tasksAll.length?Math.round((tasksDone/tasksAll.length)*100):0;

  var debtStats=computeDebtStats();
  var totalDebt=debtStats.filter(function(d){return d.type==="i_owe"}).reduce(function(s,d){return s+d.totalAmount},0);
  var totalPaid=debtStats.filter(function(d){return d.type==="i_owe"}).reduce(function(s,d){return s+d.paid},0);
  var owedToMe=debtStats.filter(function(d){return d.type==="owed_to_me"}).reduce(function(s,d){return s+d.remaining},0);
  var iOwe=debtStats.filter(function(d){return d.type==="i_owe"}).reduce(function(s,d){return s+d.remaining},0);

  var dayList=[];for(var i=1;i<=monthLen;i++)dayList.push(i);
  var dailyTotals=dayList.map(function(d){
    var key=toKey(state.viewYear,state.viewMonth,d);if(key>todayKey())return null;
    var c=0;habitStatsMonth.forEach(function(h){if(h.allDates.has(key))c+=1});return c;
  });
  var chartPoints=[];var chartW=560,chartH=90;
  dailyTotals.forEach(function(v,i2){if(v===null)return;var x=(i2/Math.max(1,dailyTotals.length-1))*chartW;var y=chartH-(v/(state.habits.length||1))*chartH;chartPoints.push(x+","+y)});
  var linePath=chartPoints.length>1?"M"+chartPoints.join(" L"):"";
  var areaPath=chartPoints.length>1?"M0,"+chartH+" L"+chartPoints.join(" L")+" L"+chartPoints[chartPoints.length-1].split(",")[0]+","+chartH+" Z":"";

  var html='<div class="topbar"><div class="brand"><div class="k">Статистика</div><h1>'+MONTHS[state.viewMonth-1]+' '+state.viewYear+'</h1></div>';
  html+='<div class="month-nav"><button class="nav-arrow" onclick="App.goPrevMonth()">‹</button><button class="nav-arrow" '+(isCur?"disabled":"")+' onclick="App.goNextMonth()">›</button></div></div>';

  html+='<div class="card"><div class="card-label">Прогресс месяца</div>';
  html+='<div class="stat-row"><div class="stat-tile"><span class="n">'+monthPct+'%</span><span class="l">привычки</span></div>';
  html+='<div class="stat-tile"><span class="n">'+taskPct+'%</span><span class="l">задачи</span></div>';
  html+='<div class="stat-tile"><span class="n">'+(totalDebt?Math.round((totalPaid/totalDebt)*100):0)+'%</span><span class="l">долги закрыто</span></div>';
  html+='<div class="stat-tile"><span class="n">'+longestOverall+'</span><span class="l">рекорд-серия</span></div></div>';
  if(chartPoints.length>1){html+='<svg viewBox="0 0 '+chartW+' '+chartH+'" class="chart-svg" preserveAspectRatio="none"><path d="'+areaPath+'" class="chart-area"></path><path d="'+linePath+'" class="chart-line"></path></svg>';}
  html+='</div>';

  html+='<div class="card"><div class="card-label">Привычки</div>';
  html+='<div class="stat-row">';
  html+='<div class="stat-tile"><span class="n">'+(best?esc(best.name):"—")+'</span><span class="l">лучшая</span></div>';
  html+='<div class="stat-tile"><span class="n">'+(worst&&habitStatsMonth.length>1?esc(worst.name):"—")+'</span><span class="l">слабее всех</span></div>';
  html+='</div></div>';

  html+='<div class="card"><div class="card-label">Задачи</div><div class="stat-row">';
  html+='<div class="stat-tile"><span class="n">'+tasksDone+'</span><span class="l">выполнено</span></div>';
  html+='<div class="stat-tile"><span class="n">'+tasksMissed+'</span><span class="l">просрочено</span></div>';
  html+='</div></div>';

  html+='<div class="card"><div class="card-label">Финансы</div><div class="stat-row">';
  html+='<div class="stat-tile"><span class="n">'+fmtNum(iOwe)+'</span><span class="l">общий долг</span></div>';
  html+='<div class="stat-tile"><span class="n">'+fmtNum(totalPaid)+'</span><span class="l">погашено всего</span></div>';
  html+='<div class="stat-tile"><span class="n">'+fmtNum(owedToMe)+'</span><span class="l">мне должны</span></div>';
  html+='</div></div>';

  var unlockedCount=Object.keys(state.unlockedAchievements||{}).length;
  html+='<div class="card"><div class="card-label">Достижения · '+unlockedCount+' / '+ACHIEVEMENTS.length+'</div>';
  ACHIEVEMENTS.forEach(function(a){
    var got=!!state.unlockedAchievements[a.id];
    html+='<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line);opacity:'+(got?"1":".45")+'">';
    html+='<span style="font-size:18px">'+(got?a.icon:"🔒")+'</span><div style="flex:1"><div style="font-size:13px;font-weight:700">'+esc(a.title)+'</div>';
    html+='<div style="font-size:11px;color:var(--ink-soft)">'+esc(a.desc)+'</div></div></div>';
  });
  html+='</div>';
  return html;
}

  var tm=best?Math.round(best*0.9*2)/2:null;
  var html='<div class="card"><div class="card-label">ROAD TO 100 · Жим лёжа</div>';
  html+='<div class="row between" style="align-items:baseline"><span style="font-size:24px;font-weight:800">'+(best?fmtNum(best):"—")+' кг</span><span style="font-size:12px;color:var(--ink-soft)">цель 100 кг</span></div>';
  html+='<div class="bartrack" style="margin-top:8px"><div class="barfill" style="width:'+pct+'%;background:var(--accent)"></div></div>';
  html+='<div class="row between" style="margin-top:4px"><span class="barlbl">'+pct+'% · осталось '+fmtNum(Math.max(0,BENCH_TARGET-best))+' кг</span>'+(tm?'<span class="barlbl">Training max ~'+tm+' кг</span>':'')+'</div>';
  html+='<div class="row wrap" style="margin-top:10px;gap:6px">';
  BENCH_MILESTONES.forEach(function(m){html+='<span class="tag" style="'+(best>=m?"background:var(--accent);color:var(--accent-ink)":"")+'">'+m+'</span>'});
  html+='</div>';
  if(ui.benchAdding){
    var f=ui.benchForm;
    html+='<div class="bench-form" style="margin-top:10px"><div class="form-grid"><input name="weight" placeholder="Вес, кг" inputmode="decimal" value="'+esc(f.weight)+'" oninput="App.setBenchField(\'weight\',this.value)">';
    html+='<input placeholder="Повторы" inputmode="numeric" value="'+esc(f.reps)+'" oninput="App.setBenchField(\'reps\',this.value)">';
    html+='<select onchange="App.setBenchField(\'rir\',this.value)"><option value="0" '+(f.rir==="0"?"selected":"")+'>Отказ</option><option value="1" '+(f.rir==="1"?"selected":"")+'>Ещё 1</option><option value="2" '+(f.rir==="2"?"selected":"")+'>Ещё 2</option><option value="3" '+(f.rir==="3"?"selected":"")+'>Легко</option></select></div>';
    html+='<div class="row"><button class="btn btn-accent" onclick="App.addBenchLog()">Записать</button><button class="btn btn-ghost" onclick="App.cancelBenchAdd()">Отмена</button></div></div>';
  }else{
    html+='<button class="btn-ghost btn" style="margin-top:6px" onclick="App.openBenchAdd()">+ записать подход жима</button>';
  }
  if(state.benchLogs.length){
    html+='<div style="margin-top:8px;font-size:11px;color:var(--ink-soft)">Последний: '+fmtNum(state.benchLogs[0].weight)+'×'+state.benchLogs[0].reps+' · e1ПМ ≈ '+fmtNum(state.benchLogs[0].e1rm)+' кг · '+esc(state.benchLogs[0].date)+'</div>';
  }
  html+='<div style="margin-top:8px;font-size:10.5px;color:var(--ink-soft)">Это расчётная оценка (формула Эпли), не гарантированный факт. Не проверяй истинный максимум без страховки/рамы.</div>';
  html+='</div>';
  return html;
}
function renderWorkoutScreen(){
  var w=state.activeWorkout;
  var ex=w.exercises[w.exIndex];
  var draft=ui.gymNextWeightDraft[w.exIndex];
  if(draft===undefined){draft=suggestNextWeight(ex.name,ex.repHigh);ui.gymNextWeightDraft[w.exIndex]=draft===null?"":draft;draft=ui.gymNextWeightDraft[w.exIndex];}
  var doneCount=ex.sets.filter(function(s){return s.done}).length;

  var html='<div class="topbar"><div class="brand"><div class="k">Full Body '+w.programKey+'</div><h1>'+esc(ex.name)+'</h1></div>';
  html+='<button class="btn btn-ghost" onclick="App.abandonWorkout()">✕</button></div>';

  html+='<div class="row wrap" style="gap:6px;margin-bottom:12px">';
  w.exercises.forEach(function(e,i){
    var done=e.sets.filter(function(s){return s.done}).length>=e.sets.length&&e.sets.length>0;
    html+='<button class="subtab'+(i===w.exIndex?" is-active":"")+'" style="'+(done&&i!==w.exIndex?"opacity:.6":"")+'" onclick="App.gymGoExercise('+i+')">'+(done?"✓ ":"")+(i+1)+'</button>';
  });
  html+='</div>';

  if(ui.restEndAt){
    var secLeft=Math.max(0,Math.ceil((ui.restEndAt-Date.now())/1000));
    html+='<div class="card" style="text-align:center;background:var(--card-raised)"><div class="card-label" style="margin-bottom:2px">Отдых · '+esc(ui.restExName)+'</div>';
    html+='<div id="restCountdown" style="font-size:34px;font-weight:800;font-variant-numeric:tabular-nums">'+fmtTime(secLeft)+'</div>';
    html+='<div class="row" style="justify-content:center;margin-top:8px"><button class="step-btn" onclick="App.adjustRest(-15)">−15с</button><button class="step-btn" onclick="App.adjustRest(15)">+15с</button><button class="btn btn-ghost" onclick="App.skipRest()">Пропустить</button></div></div>';
  }

  html+='<div class="card"><div class="card-label">'+ex.sets.length+' / '+"?"+' подходов · '+ex.repLow+'–'+ex.repHigh+' повторений</div>';
  ex.sets.forEach(function(st,si){
    html+='<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span style="font-size:13px;color:var(--ink-soft)">Подход '+(si+1)+'</span>';
    html+='<span style="font-weight:700">'+fmtNum(st.weight)+' кг × '+st.reps+'</span><span class="icon-btn" onclick="App.removeSet('+w.exIndex+','+si+')">×</span></div>';
  });

  html+='<div style="margin-top:14px"><div class="card-label">Следующий подход</div>';
  html+='<div class="row" style="justify-content:center;gap:10px;margin-bottom:8px">';
  html+='<button class="step-btn" style="width:40px;height:40px;font-size:18px" onclick="App.gymBumpDraft('+w.exIndex+',-2.5)">−2,5</button>';
  html+='<input style="width:90px;text-align:center;font-size:20px;font-weight:800" inputmode="decimal" value="'+esc(draft)+'" oninput="App.gymSetWeightDraft('+w.exIndex+',this.value)">';
  html+='<button class="step-btn" style="width:40px;height:40px;font-size:18px" onclick="App.gymBumpDraft('+w.exIndex+',2.5)">+2,5</button></div>';
  html+='<div class="row" style="justify-content:center;gap:10px"><span style="font-size:12px;color:var(--ink-soft)">кг × </span>';
  html+='<input class="reps-input-'+w.exIndex+'" style="width:70px;text-align:center;font-size:20px;font-weight:800" inputmode="numeric" value="'+ex.repHigh+'"></div>';
  html+='<button class="btn btn-accent" style="width:100%;padding:12px;font-size:14px;margin-top:10px" onclick="App.logSet('+w.exIndex+',\'.reps-input-'+w.exIndex+'\')">✓ ПОДХОД ГОТОВ</button>';
  html+='</div></div>';

  html+='<div class="row wrap" style="gap:8px;margin-bottom:14px">';
  if(w.exIndex>0)html+='<button class="btn btn-ghost" onclick="App.gymGoExercise('+(w.exIndex-1)+')">‹ Пред. упражнение</button>';
  if(w.exIndex<w.exercises.length-1)html+='<button class="btn btn-ghost" onclick="App.gymGoExercise('+(w.exIndex+1)+')">След. упражнение ›</button>';
  html+='</div>';

  var histKey=ex.name;
  var hist=exerciseHistory(histKey);
  html+='<div class="card"><div class="row between"><div class="card-label" style="margin:0">История: '+esc(ex.name)+'</div>';
  html+='<span class="icon-btn" onclick="App.toggleGymHistory(\''+GYM_SLUG(histKey)+'\')">'+(ui.gymHistoryOpen===GYM_SLUG(histKey)?"скрыть":"показать")+'</span></div>';
  if(ui.gymHistoryOpen===GYM_SLUG(histKey)){
    if(!hist.length)html+='<div class="empty">Ещё нет истории по этому упражнению.</div>';
    else hist.slice(0,8).forEach(function(h){
      html+='<div style="font-size:12px;padding:5px 0;border-bottom:1px solid var(--line)">'+esc(h.date)+' — '+h.sets.map(function(s){return fmtNum(s.weight)+"×"+s.reps}).join(", ")+'</div>';
    });
  }
  html+='</div>';

  html+='<button class="btn btn-accent" style="width:100%;padding:13px;font-size:14px;margin-top:6px" onclick="App.finishWorkout()">ЗАВЕРШИТЬ ТРЕНИРОВКУ</button>';
  return html;
}
function fmtTime(sec){var m=Math.floor(sec/60),s=sec%60;return m+":"+pad(s)}

/* ---------- render: journal tab ---------- */
function renderJournalTab(){
  if(!ui.journalForm)ui.journalForm=state.journal[ui.journalDate]?Object.assign({},state.journal[ui.journalDate]):emptyJournalForm();
  var today=todayKey();
  var sum=computeDaySummary(ui.journalDate);
  var html='<div class="topbar"><div class="brand"><div class="k">Дневник</div><h1>'+(ui.journalDate===today?"Итоги дня":ui.journalDate)+'</h1></div>';
  html+='<div class="month-nav"><button class="nav-arrow" onclick="App.journalNavDay(-1)">‹</button><button class="nav-arrow" '+(ui.journalDate>=today?"disabled":"")+' onclick="App.journalNavDay(1)">›</button></div></div>';

  html+='<div class="hero"><div class="greet">ДЕНЬ '+(ui.journalDate===today?"ПРОДОЛЖАЕТСЯ":"ЗАВЕРШЁН")+'</div>';
  html+='<div class="ring-wrap" style="margin-top:10px"><div style="flex:1">';
  html+='<div style="font-size:13px">Привычки: '+sum.doneHabits+'/'+sum.totalHabits+'</div>';
  html+='<div style="font-size:13px;margin-top:4px">Задачи: '+sum.doneTasks+'/'+sum.totalTasks+'</div>';
  html+='<div style="font-size:13px;margin-top:4px">🔥 Серия: '+sum.streak+'</div>';
  html+='<div style="font-size:13px;margin-top:4px">Финансы: '+(sum.net>=0?"+":"")+fmtNum(sum.net)+'</div></div>';
  html+='<div style="text-align:center"><div style="font-size:26px;font-weight:800">'+sum.pct+'%</div><div style="font-size:10px;opacity:.85">прогресс</div></div></div>';
  if(sum.mainAchievement)html+='<div class="quote">Главное: «'+esc(sum.mainAchievement)+'»</div>';
  if(sum.tomorrowTask)html+='<div class="quote">Завтра: «'+esc(sum.tomorrowTask.title)+'»</div>';
  html+='</div>';

  var f=ui.journalForm;
  html+='<div class="card"><div class="card-label">Настроение</div><div class="row" style="justify-content:space-between">';
  MOODS.forEach(function(m){html+='<button class="btn" style="font-size:22px;padding:8px 10px;background:'+(f.mood===m.v?"var(--accent)":"var(--card-raised)")+'" onclick="App.setJournalField(\'mood\',\''+m.v+'\')">'+m.e+'</button>'});
  html+='</div></div>';

  html+='<div class="card"><div class="card-label">Энергия</div><div class="row" style="justify-content:space-between">';
  [1,2,3,4,5].forEach(function(n){html+='<button class="step-btn" style="width:38px;height:38px;font-size:15px;'+(f.energy===n?"background:var(--accent);color:var(--accent-ink);border-color:var(--accent)":"")+'" onclick="App.setJournalField(\'energy\','+n+')">'+n+'</button>'});
  html+='</div></div>';

  html+='<div class="card"><div class="card-label">Как прошёл день?</div><textarea rows="3" style="width:100%;resize:vertical" oninput="App.setJournalField(\'q1\',this.value)">'+esc(f.q1)+'</textarea></div>';
  html+='<div class="card"><div class="card-label">Что получилось?</div><textarea rows="2" style="width:100%;resize:vertical" oninput="App.setJournalField(\'q2\',this.value)">'+esc(f.q2)+'</textarea></div>';
  html+='<div class="card"><div class="card-label">Что не получилось?</div><textarea rows="2" style="width:100%;resize:vertical" oninput="App.setJournalField(\'q3\',this.value)">'+esc(f.q3)+'</textarea></div>';
  html+='<div class="card"><div class="card-label">Что важно сделать завтра?</div><textarea rows="2" style="width:100%;resize:vertical" oninput="App.setJournalField(\'q4\',this.value)">'+esc(f.q4)+'</textarea></div>';

  html+='<button class="btn btn-accent" style="width:100%;padding:12px;font-size:14px" onclick="App.saveJournalEntry()">Сохранить запись</button>';

  var pastDates=Object.keys(state.journal).sort().reverse();
  if(pastDates.length){
    html+='<div class="card" style="margin-top:14px"><div class="card-label">История</div>';
    pastDates.slice(0,20).forEach(function(d){
      var e=state.journal[d];var moodEmoji=(MOODS.find(function(m){return m.v===e.mood})||{}).e||"";
      html+='<div class="task-item" style="align-items:center;cursor:pointer" onclick="App.openJournalDay(\''+d+'\')"><div class="task-main"><div class="task-title">'+moodEmoji+' '+esc(d)+'</div>';
      html+='<div class="task-meta"><span class="tag">'+(e.q1?esc(e.q1.slice(0,40))+(e.q1.length>40?"…":""):"без заметки")+'</span></div></div>';
      html+='<div class="task-actions"><button class="icon-btn" onclick="event.stopPropagation();App.deleteJournalEntry(\''+d+'\')">×</button></div></div>';
    });
    html+='</div>';
  }
  return html;
}

/* ---------- render: settings tab ---------- */
function renderSettingsTab(){
  var html='<div class="topbar"><div class="brand"><div class="k">Настройки</div><h1>Настройки</h1></div></div>';
  html+='<div class="card"><div class="card-label">Тема</div><div class="row">';
  html+='<button class="btn '+(state.theme==="light"?"btn-accent":"btn-ghost")+'" onclick="App.setThemeExplicit(\'light\')">☀ Светлая</button>';
  html+='<button class="btn '+(state.theme==="dark"?"btn-accent":"btn-ghost")+'" onclick="App.setThemeExplicit(\'dark\')">🌙 Тёмная</button>';
  html+='</div></div>';
  html+='<div class="card"><div class="card-label">Звук</div><div class="row">';
  html+='<button class="btn '+(state.soundOn!==false?"btn-accent":"btn-ghost")+'" onclick="App.setSound(true)">🔊 Вкл</button>';
  html+='<button class="btn '+(state.soundOn===false?"btn-accent":"btn-ghost")+'" onclick="App.setSound(false)">🔇 Выкл</button>';
  html+='</div></div>';
  html+='<div class="card"><div class="card-label">Данные</div>';
  html+='<div class="row wrap"><button class="btn btn-ghost" onclick="App.exportData()">⬇ Экспорт в файл</button>';
  html+='<button class="btn btn-ghost" style="color:var(--bad)" onclick="App.resetData()">Сбросить все данные</button></div></div>';
  return html;
}
function setThemeExplicit(t){setTheme(t)}
function exportData(){
  var blob=new Blob([JSON.stringify({habits:state.habits,entries:state.entries,weekTasks:state.weekTasks,debts:state.debts,transactions:state.transactions,tasks:state.tasks,goals:state.goals},null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="habit-tracker-export.json";a.click();
  setTimeout(function(){URL.revokeObjectURL(url)},1000);
}
function resetData(){
  if(!confirm("Точно удалить все данные приложения без возможности восстановления?"))return;
  localStorage.removeItem(STORAGE_KEY);localStorage.removeItem(OLD_KEY);
  state=loadState();state.viewYear=todayObj().y;state.viewMonth=todayObj().m;state.activeTab="dashboard";
  render();
}

/* ---------- shell / nav ---------- */
var NAV=[["dashboard","🏠","Главная"],["habits","🔥","Привычки"],["tasks","📝","Задачи"],["gym","🏋️","Зал"],["journal","📓","Дневник"],["debts","💰","Долги"],["stats","📊","Статистика"],["settings","⚙️","Настройки"]];

function navHtml(){
  var h="";
  NAV.forEach(function(n){
    h+='<button class="nav-btn'+(state.activeTab===n[0]?" is-active":"")+'" onclick="App.setTab(\''+n[0]+'\')"><span class="ic">'+n[1]+'</span><span>'+n[2]+'</span></button>';
  });
  return h;
}

function render(){
  var body="";
  if(state.activeTab==="dashboard")body=renderDashboard();
  else if(state.activeTab==="habits")body=renderHabitsTab();
  else if(state.activeTab==="tasks")body=renderTasksTab();
  else if(state.activeTab==="gym")body=renderGymTab();
  else if(state.activeTab==="journal")body=renderJournalTab();
  else if(state.activeTab==="debts")body=renderDebtsTab();
  else if(state.activeTab==="stats")body=renderStatsTab();
  else body=renderSettingsTab();

  var html='<div class="app" data-theme="'+state.theme+'"><div class="shell">';
  html+='<div class="side"><div class="brand"><div class="k">Компас</div><h1 style="font-size:16px">Дисциплина</h1></div>'+navHtml()+
    '<div style="margin-top:auto"><button class="nav-btn" onclick="App.toggleThemeQuick()"><span class="ic">'+(state.theme==="dark"?"☀️":"🌙")+'</span><span>Тема</span></button></div></div>';
  html+='<div class="main">';
  if(state.activeTab!=="dashboard"&&state.activeTab!=="settings"){
    // theme toggle shown inline on non-dashboard mobile pages via topbar already; add quick toggle top-right on dashboard below
  }
  html+=body;
  html+='</div></div>';
  html+='<div class="bottomnav">'+navHtml()+'</div>';
  if(ui.toast)html+='<div class="toast">'+esc(ui.toast)+'</div>';
  html+='</div>';
  document.getElementById("root").innerHTML=html;
}

window.App={
  setTab:setTab,
  toggleThemeQuick:function(){setTheme(state.theme==="dark"?"light":"dark")},
  setThemeExplicit:setThemeExplicit,
  toggleDate:toggleDate,addHabit:addHabit,removeHabit:removeHabit,
  setNewHabitDraft:function(v){ui.newHabitDraft=v},openAdd:function(){ui.adding=true;render();focusSel(".card input")},cancelAdd:function(){ui.adding=false;render()},
  goPrevMonth:goPrevMonth,goNextMonth:goNextMonth,
  setWeekTaskDraft:function(wi,v){ui.taskDrafts[wi]=v},addWeekTask:addWeekTask,toggleWeekTask:toggleWeekTask,removeWeekTask:removeWeekTask,
  openTaskAdd:openTaskAdd,openTaskEdit:openTaskEdit,cancelTaskAdd:cancelTaskAdd,setTaskField:setTaskField,saveTask:saveTask,
  toggleTaskDone:toggleTaskDone,deleteTask:deleteTask,setTaskFilter:setTaskFilter,
  openGoalAdd:openGoalAdd,cancelGoalAdd:cancelGoalAdd,setGoalField:setGoalField,addGoal:addGoal,adjustGoal:adjustGoal,removeGoal:removeGoal,
  openDebtAdd:openDebtAdd,cancelDebtAdd:cancelDebtAdd,setDebtField:setDebtField,addDebt:addDebt,removeDebt:removeDebt,
  setDebtsSubtab:function(v){ui.debtsSubtab=v;render()},
  openTxAdd:openTxAdd,cancelTxAdd:cancelTxAdd,setTxField:setTxField,addTransaction:addTransaction,removeTransaction:removeTransaction,
  exportData:exportData,resetData:resetData,
  setSound:function(v){state.soundOn=v;save();render()},
  startWorkout:startWorkout,abandonWorkout:abandonWorkout,gymSetWeightDraft:gymSetWeightDraft,gymBumpDraft:gymBumpDraft,
  logSet:logSet,removeSet:removeSet,gymGoExercise:gymGoExercise,adjustRest:adjustRest,skipRest:skipRest,finishWorkout:finishWorkout,
  toggleGymHistory:function(k){ui.gymHistoryOpen=ui.gymHistoryOpen===k?null:k;render()},
  openBwEdit:openBwEdit,setBodyWeightField:setBodyWeightField,saveBodyWeight:saveBodyWeight,
  openBenchAdd:openBenchAdd,cancelBenchAdd:cancelBenchAdd,setBenchField:setBenchField,addBenchLog:addBenchLog,
  openJournalDay:openJournalDay,setJournalField:setJournalField,saveJournalEntry:saveJournalEntry,deleteJournalEntry:deleteJournalEntry,
  journalNavDay:function(delta){ui.journalDate=delta>0?next1(ui.journalDate):back1(ui.journalDate);ui.journalForm=null;render()}
};

document.getElementById("root").addEventListener("click",function(e){
  var btn=e.target.closest("button");
  if(btn)playClick();
});

setInterval(function(){
  if(!ui.restEndAt)return;
  var secLeft=Math.max(0,Math.ceil((ui.restEndAt-Date.now())/1000));
  var el=document.getElementById("restCountdown");
  if(el)el.textContent=fmtTime(secLeft);
  if(secLeft<=0){
    ui.restEndAt=null;
    try{playClick();setTimeout(playClick,140);}catch(e){}
    render();
  }
},500);

render();
})();
</script>
