<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Привычки" />
<meta name="theme-color" content="#14161A" />
<title>Трекер привычек</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314161A'/%3E%3Ccircle cx='50' cy='50' r='28' fill='none' stroke='%233FBBA3' stroke-width='9'/%3E%3Cpath d='M36 50 46 60 66 38' fill='none' stroke='%233FBBA3' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314161A'/%3E%3Ccircle cx='50' cy='50' r='28' fill='none' stroke='%233FBBA3' stroke-width='9'/%3E%3Cpath d='M36 50 46 60 66 38' fill='none' stroke='%233FBBA3' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #14161A; }
  .ht-root {
    --bg: #14161A; --card: #1D2025; --card-raised: #232730; --ink: #ECEDEF;
    --ink-soft: #8A8F9C; --line: #2C3038; --accent: #3FBBA3;
    font-family: -apple-system, "Inter", "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
    padding: 24px 16px 60px; box-sizing: border-box; max-width: 640px; margin: 0 auto;
    font-variant-numeric: tabular-nums;
    padding-top: calc(24px + env(safe-area-inset-top));
    padding-bottom: calc(60px + env(safe-area-inset-bottom));
  }
  .ht-header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .ht-kicker { font-size: 11px; letter-spacing: 0.06em; color: var(--ink-soft); margin-bottom: 4px; text-transform: uppercase; }
  .ht-header h1 { font-size: 20px; font-weight: 700; margin: 0; text-transform: capitalize; }
  .ht-month-nav { display: flex; align-items: center; gap: 10px; }
  .ht-nav-btn { font-size: 15px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; width: 28px; height: 28px; cursor: pointer; color: var(--ink); display: flex; align-items: center; justify-content: center; }
  .ht-nav-btn:disabled { opacity: 0.3; }
  .ht-month-label { font-size: 13px; font-weight: 600; text-transform: capitalize; min-width: 100px; text-align: center; }
  .ht-save-error { font-size: 12px; color: #E07890; margin-bottom: 12px; }
  .ht-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px; margin-bottom: 14px; }
  .ht-card-label { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
  .ht-summary-row { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 14px; }
  .ht-summary-chart .ht-chart-svg { width: 100%; height: 64px; display: block; }
  .ht-chart-area { fill: rgba(63,187,163,0.16); }
  .ht-chart-line { fill: none; stroke: var(--accent); stroke-width: 2; }
  .ht-chart-empty { font-size: 12px; color: var(--ink-soft); padding: 18px 0; }
  .ht-summary-donut { display: flex; align-items: center; gap: 16px; }
  .ht-donut-svg { width: 64px; height: 64px; transform: rotate(-90deg); flex: none; }
  .ht-donut-track { fill: none; stroke: #2C3038; stroke-width: 9; }
  .ht-donut-fill { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; }
  .ht-donut-center { display: flex; align-items: baseline; gap: 2px; }
  .ht-donut-num { font-size: 16px; font-weight: 700; }
  .ht-donut-den { font-size: 11px; color: var(--ink-soft); }
  .ht-summary-stats { display: flex; justify-content: space-between; gap: 8px; }
  .ht-mini-stat { display: flex; flex-direction: column; gap: 2px; }
  .ht-mini-stat .n { font-size: 16px; font-weight: 700; }
  .ht-mini-stat .l { font-size: 10px; color: var(--ink-soft); }
  .ht-grid-card { padding: 10px; }
  .ht-empty { color: var(--ink-soft); padding: 20px 8px; font-size: 13px; }
  .ht-table-wrap { overflow-x: auto; }
  .ht-table { border-collapse: collapse; width: 100%; }
  .ht-sticky-col { position: sticky; left: 0; background: var(--card); z-index: 2; }
  .ht-corner { min-width: 128px; }
  .ht-week-band { font-size: 10px; font-weight: 700; color: var(--ink); padding: 5px 0; text-align: center; border-radius: 6px 6px 0 0; }
  .ht-day-cell { width: 26px; min-width: 26px; text-align: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .ht-day-cell .dn { display: block; font-size: 11px; font-weight: 600; }
  .ht-day-cell .wd { display: block; font-size: 8px; color: var(--ink-soft); text-transform: lowercase; }
  .ht-day-cell.is-today { color: var(--accent); }
  .ht-day-cell.is-today .dn { color: var(--accent); }
  .ht-progress-head { min-width: 100px; font-size: 10px; color: var(--ink-soft); text-align: center; text-transform: uppercase; }
  .ht-name-cell { display: flex; align-items: center; gap: 6px; padding: 7px 6px 7px 2px; border-bottom: 1px solid var(--line); font-size: 12.5px; white-space: nowrap; }
  .ht-name-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .ht-name-text { overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
  .ht-target-tag { color: var(--ink-soft); font-size: 10.5px; }
  .ht-remove { margin-left: auto; font-size: 14px; color: var(--ink-soft); cursor: pointer; padding: 0 2px; }
  .ht-remove:active { color: #E07890; }
  .ht-check-cell { text-align: center; border-bottom: 1px solid var(--line); padding: 3px 0; }
  .ht-box { width: 20px; height: 20px; border-radius: 4px; border: 1.4px solid var(--line); background: var(--card-raised); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .ht-box.is-checked { background: var(--c); border-color: var(--c); }
  .ht-box.is-future { opacity: 0.3; }
  .ht-progress-cell { padding: 7px 6px; border-bottom: 1px solid var(--line); min-width: 100px; }
  .ht-bar-track { height: 6px; border-radius: 3px; background: #2C3038; overflow: hidden; margin-bottom: 3px; }
  .ht-bar-fill { height: 100%; border-radius: 3px; }
  .ht-bar-label { font-size: 10px; color: var(--ink-soft); }
  .ht-ranking-list { list-style: none; margin: 0; padding: 0; counter-reset: rank; }
  .ht-ranking-list li { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
  .ht-ranking-list li:last-child { border-bottom: none; }
  .ht-ranking-list li::before { counter-increment: rank; content: counter(rank); font-size: 11px; color: var(--ink-soft); width: 14px; }
  .ht-rank-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .ht-rank-name { flex: 1; }
  .ht-rank-count { font-weight: 700; font-size: 12px; }
  .ht-tasks-wrap { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
  .ht-task-col { flex: 0 0 155px; display: flex; flex-direction: column; gap: 8px; }
  .ht-task-col-head { font-size: 11px; font-weight: 700; padding-bottom: 6px; border-bottom: 2px solid; }
  .ht-task-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; min-height: 4px; }
  .ht-task-item { display: flex; align-items: center; gap: 6px; }
  .ht-task-check { width: 17px; height: 17px; border-radius: 4px; border: 1.4px solid var(--line); background: var(--card-raised); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; flex: none; }
  .ht-task-check.is-checked { background: var(--accent); border-color: var(--accent); }
  .ht-task-text { font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ht-task-text.is-done { color: var(--ink-soft); text-decoration: line-through; }
  .ht-task-remove { font-size: 13px; color: var(--ink-soft); cursor: pointer; }
  .ht-task-add input { width: 100%; font-family: inherit; font-size: 12px; background: var(--card-raised); border: 1px solid var(--line); border-radius: 5px; padding: 6px 7px; color: var(--ink); outline: none; }
  .ht-add { margin-top: 4px; }
  .ht-add-trigger { font-size: 13px; background: none; border: none; color: var(--ink-soft); cursor: pointer; padding: 6px 0; }
  .ht-add-form { display: flex; align-items: center; gap: 10px; }
  .ht-add-mark { font-size: 16px; color: var(--accent); font-weight: 700; }
  .ht-add-form input { flex: 1; font-family: inherit; font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; color: var(--ink); outline: none; }
  .ht-add-save { font-size: 12px; background: var(--accent); color: #14161A; border: none; border-radius: 6px; padding: 9px 14px; cursor: pointer; font-weight: 700; }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";

  /* ---------- date helpers ---------- */
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var toKey = function (y, m, d) { return y + "-" + pad(m) + "-" + pad(d); };
  var todayObj = function () {
    var dt = new Date();
    return { y: dt.getFullYear(), m: dt.getMonth() + 1, d: dt.getDate() };
  };
  var todayKey = function () { var t = todayObj(); return toKey(t.y, t.m, t.d); };
  var daysInMonth = function (y, m) { return new Date(y, m, 0).getDate(); };
  var weekdayShort = function (y, m, d) {
    var dt = new Date(y, m - 1, d);
    return dt.toLocaleDateString("ru-RU", { weekday: "short" }).replace(".", "");
  };
  var MONTH_NAMES = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
  var formatHeaderDate = function () {
    return new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
  };
  var back1 = function (key) {
    var p = key.split("-").map(Number), dt = new Date(p[0], p[1] - 1, p[2]);
    dt.setDate(dt.getDate() - 1);
    return toKey(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
  };
  var next1 = function (key) {
    var p = key.split("-").map(Number), dt = new Date(p[0], p[1] - 1, p[2]);
    dt.setDate(dt.getDate() + 1);
    return toKey(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
  };

  var WEEK_COLORS = ["#274A44", "#4A3A26", "#472B39", "#372C4A", "#2B4630"];
  var HABIT_PALETTE = ["#3FBBA3", "#E0A455", "#B183E8", "#E07890", "#5CA3E0", "#A3C05C"];
  var DEFAULT_HABITS = [
    { name: "Зал", weeklyTarget: 3 },
    { name: "Торговля: 3 сделки", weeklyTarget: null },
    { name: "Книга: 10 страниц", weeklyTarget: null },
    { name: "Учёба", weeklyTarget: null },
    { name: "Работа", weeklyTarget: null }
  ];

  function currentStreak(dateSet, today) {
    var streak = 0, cursor = today;
    if (!dateSet.has(cursor)) cursor = back1(cursor);
    while (dateSet.has(cursor)) { streak += 1; cursor = back1(cursor); }
    return streak;
  }
  function longestStreak(dateSet) {
    if (dateSet.size === 0) return 0;
    var sorted = Array.from(dateSet).sort();
    var best = 1, run = 1;
    for (var i = 1; i < sorted.length; i++) {
      if (next1(sorted[i - 1]) === sorted[i]) run += 1; else run = 1;
      best = Math.max(best, run);
    }
    return best;
  }
  function perHabitTarget(h, denominatorDays) {
    if (h.weeklyTarget) return Math.max(1, Math.round((h.weeklyTarget * denominatorDays) / 7));
    return denominatorDays;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var STORAGE_KEY = "habit-tracker-local-v1";

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        return {
          habits: parsed.habits || [],
          entries: parsed.entries || {},
          weekTasks: parsed.weekTasks || {}
        };
      }
    } catch (e) {}
    var seeded = DEFAULT_HABITS.map(function (h, i) {
      return {
        id: "h_" + Date.now() + "_" + i,
        name: h.name,
        weeklyTarget: h.weeklyTarget,
        color: HABIT_PALETTE[i % HABIT_PALETTE.length],
        createdAt: todayKey()
      };
    });
    return { habits: seeded, entries: {}, weekTasks: {} };
  }

  var state = loadState();
  state.viewYear = todayObj().y;
  state.viewMonth = todayObj().m;
  var taskDrafts = {};
  var adding = false;
  var newHabitDraft = "";
  var saveError = false;

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        habits: state.habits, entries: state.entries, weekTasks: state.weekTasks
      }));
      saveError = false;
    } catch (e) {
      saveError = true;
    }
  }

  /* ---------- actions ---------- */
  function toggleDate(habitId, dateKey) {
    var today = todayKey();
    if (dateKey > today) return;
    var he = Object.assign({}, state.entries[habitId] || {});
    if (he[dateKey]) delete he[dateKey]; else he[dateKey] = true;
    state.entries = Object.assign({}, state.entries);
    state.entries[habitId] = he;
    save(); render();
  }
  function addHabit() {
    var name = (newHabitDraft || "").trim();
    if (!name) return;
    var habit = {
      id: "h_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
      name: name, weeklyTarget: null,
      color: HABIT_PALETTE[state.habits.length % HABIT_PALETTE.length],
      createdAt: todayKey()
    };
    state.habits = state.habits.concat([habit]);
    newHabitDraft = ""; adding = false;
    save(); render();
  }
  function removeHabit(id) {
    state.habits = state.habits.filter(function (h) { return h.id !== id; });
    var ne = Object.assign({}, state.entries); delete ne[id];
    state.entries = ne;
    save(); render();
  }
  function weekKey(wi) { return state.viewYear + "-" + state.viewMonth + "-" + wi; }
  function addTask(wi) {
    var text = (taskDrafts[wi] || "").trim();
    if (!text) return;
    var wk = weekKey(wi);
    var list = (state.weekTasks[wk] || []).concat([{ id: "t_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6), text: text, done: false }]);
    state.weekTasks = Object.assign({}, state.weekTasks); state.weekTasks[wk] = list;
    taskDrafts[wi] = "";
    save(); render();
  }
  function toggleTask(wi, taskId) {
    var wk = weekKey(wi);
    var list = (state.weekTasks[wk] || []).map(function (t) { return t.id === taskId ? Object.assign({}, t, { done: !t.done }) : t; });
    state.weekTasks = Object.assign({}, state.weekTasks); state.weekTasks[wk] = list;
    save(); render();
  }
  function removeTask(wi, taskId) {
    var wk = weekKey(wi);
    var list = (state.weekTasks[wk] || []).filter(function (t) { return t.id !== taskId; });
    state.weekTasks = Object.assign({}, state.weekTasks); state.weekTasks[wk] = list;
    save(); render();
  }
  function goPrevMonth() {
    if (state.viewMonth === 1) { state.viewYear -= 1; state.viewMonth = 12; } else state.viewMonth -= 1;
    render();
  }
  function goNextMonth() {
    var t0 = todayObj();
    if (state.viewYear === t0.y && state.viewMonth === t0.m) return;
    if (state.viewMonth === 12) { state.viewYear += 1; state.viewMonth = 1; } else state.viewMonth += 1;
    render();
  }
  function setNewHabitDraft(v) { newHabitDraft = v; }
  function setTaskDraft(wi, v) { taskDrafts[wi] = v; }
  function openAdd() { adding = true; render(); focusAfter(".ht-add-form input"); }
  function cancelAdd() { adding = false; newHabitDraft = ""; render(); }

  function focusAfter(sel) {
    requestAnimationFrame(function () {
      var el = document.querySelector(sel);
      if (el) el.focus();
    });
  }

  /* ---------- render ---------- */
  function render() {
    var today = todayKey();
    var t0 = todayObj();
    var isCurrentMonth = state.viewYear === t0.y && state.viewMonth === t0.m;
    var monthLen = daysInMonth(state.viewYear, state.viewMonth);
    var dayList = []; for (var i = 1; i <= monthLen; i++) dayList.push(i);
    var groups = []; for (var gi = 0; gi < dayList.length; gi += 7) groups.push(dayList.slice(gi, gi + 7));
    var denominatorDays = isCurrentMonth ? t0.d : monthLen;

    var habitStats = state.habits.map(function (h) {
      var allDates = new Set(Object.keys(state.entries[h.id] || {}));
      var monthCount = dayList.filter(function (d) { return allDates.has(toKey(state.viewYear, state.viewMonth, d)); }).length;
      return Object.assign({}, h, {
        allDates: allDates,
        current: currentStreak(allDates, today),
        longest: longestStreak(allDates),
        monthCount: monthCount,
        target: perHabitTarget(h, denominatorDays)
      });
    });
    var rankedHabits = habitStats.slice().sort(function (a, b) { return b.monthCount - a.monthCount; });
    var dailyTotals = dayList.map(function (d) {
      var key = toKey(state.viewYear, state.viewMonth, d);
      if (key > today) return null;
      var count = 0;
      habitStats.forEach(function (h) { if (h.allDates.has(key)) count += 1; });
      return count;
    });
    var totalPossible = habitStats.reduce(function (s, h) { return s + h.target; }, 0);
    var totalDone = habitStats.reduce(function (s, h) { return s + h.monthCount; }, 0);
    var overallPct = totalPossible > 0 ? Math.round((totalDone / totalPossible) * 100) : 0;
    var doneToday = habitStats.filter(function (h) { return h.allDates.has(today); }).length;
    var bestCurrent = habitStats.reduce(function (m, h) { return Math.max(m, h.current); }, 0);

    var donutR = 42, donutC = 2 * Math.PI * donutR, donutOffset = donutC * (1 - overallPct / 100);
    var chartW = 560, chartH = 90;
    var chartPoints = [];
    dailyTotals.forEach(function (v, i) {
      if (v === null) return;
      var x = (i / Math.max(1, dailyTotals.length - 1)) * chartW;
      var y = chartH - (v / (state.habits.length || 1)) * chartH;
      chartPoints.push(x + "," + y);
    });
    var linePath = chartPoints.length > 1 ? "M" + chartPoints.join(" L") : "";
    var areaPath = chartPoints.length > 1
      ? "M0," + chartH + " L" + chartPoints.join(" L") + " L" + chartPoints[chartPoints.length - 1].split(",")[0] + "," + chartH + " Z"
      : "";

    var html = "";
    html += '<div class="ht-root">';

    html += '<header class="ht-header"><div>';
    html += '<div class="ht-kicker">Трекер привычек</div>';
    html += '<h1>' + formatHeaderDate() + '</h1></div>';
    html += '<div class="ht-month-nav">';
    html += '<button class="ht-nav-btn" onclick="App.goPrevMonth()">‹</button>';
    html += '<span class="ht-month-label">' + MONTH_NAMES[state.viewMonth - 1] + ' ' + state.viewYear + '</span>';
    html += '<button class="ht-nav-btn" ' + (isCurrentMonth ? "disabled" : "") + ' onclick="App.goNextMonth()">›</button>';
    html += '</div></header>';

    if (saveError) html += '<div class="ht-save-error">Не удалось сохранить изменения на этом устройстве.</div>';

    html += '<div class="ht-summary-row">';
    html += '<div class="ht-card ht-summary-chart"><div class="ht-card-label">Дневной прогресс</div>';
    if (chartPoints.length > 1) {
      html += '<svg viewBox="0 0 ' + chartW + ' ' + chartH + '" class="ht-chart-svg" preserveAspectRatio="none">';
      html += '<path d="' + areaPath + '" class="ht-chart-area"></path>';
      html += '<path d="' + linePath + '" class="ht-chart-line"></path></svg>';
    } else {
      html += '<div class="ht-chart-empty">Отмечайте привычки — здесь появится график</div>';
    }
    html += '</div>';

    html += '<div class="ht-card ht-summary-donut"><div style="flex:1"><div class="ht-card-label">Месяц</div>';
    html += '<div class="ht-donut-center"><span class="ht-donut-num">' + totalDone + '</span><span class="ht-donut-den">/ ' + totalPossible + ' (' + overallPct + '%)</span></div></div>';
    html += '<svg viewBox="0 0 100 100" class="ht-donut-svg">';
    html += '<circle cx="50" cy="50" r="' + donutR + '" class="ht-donut-track"></circle>';
    html += '<circle cx="50" cy="50" r="' + donutR + '" class="ht-donut-fill" stroke-dasharray="' + donutC + '" stroke-dashoffset="' + donutOffset + '"></circle>';
    html += '</svg></div>';

    html += '<div class="ht-card ht-summary-stats">';
    html += '<div class="ht-mini-stat"><span class="n">' + doneToday + '/' + state.habits.length + '</span><span class="l">сегодня</span></div>';
    html += '<div class="ht-mini-stat"><span class="n">' + bestCurrent + '</span><span class="l">лучшая серия</span></div>';
    html += '</div></div>';

    html += '<div class="ht-card ht-grid-card">';
    if (state.habits.length === 0) {
      html += '<div class="ht-empty">Пока пусто. Добавьте первую привычку ниже.</div>';
    } else {
      html += '<div class="ht-table-wrap"><table class="ht-table"><thead>';
      html += '<tr class="ht-week-row"><th class="ht-sticky-col ht-corner"></th>';
      groups.forEach(function (g, gi2) {
        html += '<th colspan="' + g.length + '" class="ht-week-band" style="background:' + WEEK_COLORS[gi2 % WEEK_COLORS.length] + '">Неделя ' + (gi2 + 1) + '</th>';
      });
      html += '<th class="ht-progress-head">Прогресс</th></tr>';
      html += '<tr class="ht-day-row"><th class="ht-sticky-col ht-corner"></th>';
      dayList.forEach(function (d) {
        var key = toKey(state.viewYear, state.viewMonth, d);
        html += '<th class="ht-day-cell' + (key === today ? ' is-today' : '') + '"><span class="dn">' + d + '</span><span class="wd">' + weekdayShort(state.viewYear, state.viewMonth, d) + '</span></th>';
      });
      html += '<th class="ht-progress-head"></th></tr></thead><tbody>';
      habitStats.forEach(function (h) {
        html += '<tr class="ht-habit-row"><td class="ht-sticky-col ht-name-cell">';
        html += '<span class="ht-name-dot" style="background:' + h.color + '"></span>';
        html += '<span class="ht-name-text">' + escapeHtml(h.name) + (h.weeklyTarget ? '<span class="ht-target-tag"> · ' + h.weeklyTarget + 'x/нед</span>' : '') + '</span>';
        html += '<span class="ht-remove" onclick="App.removeHabit(\'' + h.id + '\')">×</span></td>';
        dayList.forEach(function (d) {
          var key = toKey(state.viewYear, state.viewMonth, d);
          var filled = h.allDates.has(key);
          var future = key > today;
          html += '<td class="ht-check-cell"><button class="ht-box' + (filled ? ' is-checked' : '') + (future ? ' is-future' : '') + '" style="' + (filled ? '--c:' + h.color : '') + '" ' + (future ? 'disabled' : '') + ' onclick="App.toggleDate(\'' + h.id + '\',\'' + key + '\')">';
          if (filled) html += '<svg viewBox="0 0 20 20" width="11" height="11"><path d="M4 10.5 8 14.5 16 5.5" fill="none" stroke="#14161A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          html += '</button></td>';
        });
        html += '<td class="ht-progress-cell"><div class="ht-bar-track"><div class="ht-bar-fill" style="width:' + Math.min(100, (h.monthCount / (h.target || 1)) * 100) + '%;background:' + h.color + '"></div></div><span class="ht-bar-label">' + h.monthCount + '/' + h.target + '</span></td></tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';

    if (habitStats.length > 0) {
      html += '<div class="ht-card"><div class="ht-card-label">Рейтинг привычек за месяц</div><ol class="ht-ranking-list">';
      rankedHabits.forEach(function (h) {
        html += '<li><span class="ht-rank-dot" style="background:' + h.color + '"></span><span class="ht-rank-name">' + escapeHtml(h.name) + '</span><span class="ht-rank-count">' + h.monthCount + '</span></li>';
      });
      html += '</ol></div>';
    }

    html += '<div class="ht-card"><div class="ht-card-label">Задачи недели</div><div class="ht-tasks-wrap">';
    groups.forEach(function (g, gi3) {
      var wk = weekKey(gi3);
      var list = state.weekTasks[wk] || [];
      html += '<div class="ht-task-col"><div class="ht-task-col-head" style="border-color:' + WEEK_COLORS[gi3 % WEEK_COLORS.length] + '">Неделя ' + (gi3 + 1) + '</div><ul class="ht-task-list">';
      list.forEach(function (t) {
        html += '<li class="ht-task-item"><button class="ht-task-check' + (t.done ? ' is-checked' : '') + '" onclick="App.toggleTask(' + gi3 + ',\'' + t.id + '\')">';
        if (t.done) html += '<svg viewBox="0 0 20 20" width="9" height="9"><path d="M4 10.5 8 14.5 16 5.5" fill="none" stroke="#14161A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        html += '</button><span class="ht-task-text' + (t.done ? ' is-done' : '') + '">' + escapeHtml(t.text) + '</span>';
        html += '<span class="ht-task-remove" onclick="App.removeTask(' + gi3 + ',\'' + t.id + '\')">×</span></li>';
      });
      html += '</ul><div class="ht-task-add"><input placeholder="+ задача" value="' + escapeHtml(taskDrafts[gi3] || "") + '" oninput="App.setTaskDraft(' + gi3 + ',this.value)" onkeydown="if(event.key===\'Enter\')App.addTask(' + gi3 + ')"></div></div>';
    });
    html += '</div></div>';

    html += '<div class="ht-add">';
    if (adding) {
      html += '<div class="ht-add-form"><span class="ht-add-mark">+</span>';
      html += '<input placeholder="Например: читать 20 минут" maxlength="60" value="' + escapeHtml(newHabitDraft) + '" oninput="App.setNewHabitDraft(this.value)" onkeydown="if(event.key===\'Enter\')App.addHabit(); if(event.key===\'Escape\')App.cancelAdd();">';
      html += '<button class="ht-add-save" onclick="App.addHabit()">Добавить</button></div>';
    } else {
      html += '<button class="ht-add-trigger" onclick="App.openAdd()">+ новая привычка</button>';
    }
    html += '</div>';

    html += '</div>';
    document.getElementById("root").innerHTML = html;
  }

  window.App = {
    toggleDate: toggleDate, addHabit: addHabit, removeHabit: removeHabit,
    addTask: addTask, toggleTask: toggleTask, removeTask: removeTask,
    goPrevMonth: goPrevMonth, goNextMonth: goNextMonth,
    setNewHabitDraft: setNewHabitDraft, setTaskDraft: setTaskDraft,
    openAdd: openAdd, cancelAdd: cancelAdd
  };

  render();
})();
</script>
</body>
</html>
